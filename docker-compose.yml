version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uks_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - uks

  mysql:
    image: mysql:8.0
    container_name: uks_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: uks_sekolah
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uks

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: uks_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - uks

networks:
  uks:

volumes:
  mysql_data: